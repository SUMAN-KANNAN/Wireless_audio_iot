<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voice Room Dashboard</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inria+Sans&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/landing.css') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/mlogo.png') }}"  sizes="16x16">
    <script>
        const authToken = {{ auth_token|tojson }};
    </script>
</head>
<body>
    <div class="header">
        <div class="burger-menu" onclick="toggleSidebar()">
            &#9776; <!-- Burger icon -->
        </div>
        <div class="logo-container">
            <img src="{{ url_for('static', filename='images/mlogo.png') }}" alt="Logo" class="mlogo-header">
            <!-- <h3 class="logo-text">Mosaique</h3> -->
             <span class="logo-text"><h5>Mosaique</h5></span>
        </div>
    </div>
    <div class="container-fluid">
        <!-- Sidebar -->
        <div class="sidebar">
            <!-- <div class="logo-container">
                <img src="{{ url_for('static', filename='images/mlogo.png') }}" alt="Mosaique Logo" class="mlogo">
            </div> -->
            <div class="notifications">
                <div class="icon" onclick="unmuteAll()">
                    <img src="{{ url_for('static', filename='images/unmuteall.png') }}" class="sidebar-icon" alt="Unmute All">
                    <span class="icon-label">Unmute All</span>
                </div>
                <div class="icon" onclick="muteAll()">
                    <img src="{{ url_for('static', filename='images/mute.png') }}" class="sidebar-icon" alt="Mute All">
                    <span class="icon-label">Mute All</span>
                </div>
            </div>
            <div class="logout-section">
                <div class="icon" onclick="logout()">
                    <img src="{{ url_for('static', filename='images/logout.png') }}" class="sidebar-icon" alt="Logout">
                    <span class="icon-label">Logout</span>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="row">
                <!-- Room Tiles -->
                {% for room in rooms %}
                <div class="col-md-4">
                    <div class="tile" id="{{ room.id }}">
                        <div class="d-flex justify-content-between align-items-center tile-header">
                            <h3 class="room-name">{{ room.name }}</h3>
                            <label class="rb">
                              <span class="checkmark"></span>
                            </label>
                        </div>
                        <div class="mic-controls">
                            <img src="{{ url_for('static', filename='images/muteunmute.png') }}" class="mic" data-room="{{ room.id }}" alt="Mic for {{ room.name }}">
                            <label class="toggle-switch">
                                <input type="checkbox" id="{{ room.switch_id }}" class="mic-toggle">
                                <span class="slider round" ></span>
                            </label>
                        </div>
                        <div class="battery-status">
                            <p>Battery: <span class="battery-percentage">--%</span></p>
                            <div class="battery-bar">
                                <div class="battery-level"></div>
                            </div>
                        </div>
                    </div>
                </div>
                {% endfor %}
            </div>

            <!-- Survey Container -->
            <div class="survey-container">
                <div class="survey-grid">
                    <div class="survey-title">Survey</div>
                    <div class="rooms-listening">Rooms Listening: <span id="listeningCount">0</span></div>
                    <div class="volume-control master-volume-control">
                        <label for="masterVolume" class="rmtitle">Master Volume:</label>
                        <input type="range" id="masterVolume" class="volume-slider" min="0" max="100" value="50">
                    </div>
                    {% for room in rooms %}
                    <div class="volume-control">
                        <label for="{{ room.volume_id }}" class="rmtitle">{{ room.name }} Volume:</label>
                        <input type="range" id="{{ room.volume_id }}" class="volume-slider" data-room="{{ room.id }}" min="0" max="100" value="50">
                    </div>
                    {% endfor %}
                    <div class="profile-container">
                      <img src="{{ url_for('static', filename='images/micimg.png') }}" alt="Mic Icon" class="mic-icon">
                      <p class="sp-name">Hiro Ishida<br><span class="sp-title">CEO</span></p>
                  </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/landing.js') }}"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        function toggleSidebar(){
            const sidebar = document.querySelector('.sidebar');
            const mainContent = document.querySelector('.main-content');
            sidebar.classList.toggle('open');
            mainContent.classList.toggle('shift');
        }
    </script>
</body>
</html>
